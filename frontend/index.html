<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orchestrator Chat</title>
<script>
/* [FOUC 방지] React 마운트 전에 저장된 테마(없으면 시스템 테마)를 html 태그에 주입한다.
   번들보다 먼저 실행되어야 흰 화면 깜빡임이 없으므로 인라인으로 유지한다. */
(function () {
    const storedTheme = localStorage.getItem("orchestrator_chat_theme");
    const isDark      = storedTheme ? storedTheme === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
    if (isDark) document.documentElement.classList.add("dark");
})();
</script>
<style>
    /* 첫 페인트용 크리티컬 배경 (번들 CSS 로드 전에도 올바른 배경색 보장) */
    html      { background : #f1f5f9; }
    html.dark { background : #020617; }
</style>
</head>
<body class="bg-slate-100 text-slate-900 dark:bg-slate-950 dark:text-slate-100 h-screen overflow-hidden font-sans antialiased">
<div id="root" class="h-full"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>

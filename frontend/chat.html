<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orchestrator Chat</title>
<!-- 빌드 도구 없이 즉시 동작 : Tailwind CDN -->
<script src="https://cdn.tailwindcss.com"></script>
<style>
    .chat-scroll::-webkit-scrollbar       { width: 6px; }
    .chat-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    .chat-scroll::-webkit-scrollbar-track { background: transparent; }

    @keyframes typing-blink { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }
    .typing-dot        { animation: typing-blink 1.2s infinite; }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bubble-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .bubble-enter { animation: bubble-in 0.18s ease-out; }
</style>
</head>
<body class="bg-slate-950 text-slate-100 h-screen overflow-hidden font-sans antialiased">

<div class="h-full flex flex-col md:flex-row">

    <!-- ══════════ 좌측 사이드바 : 채팅방 목록 + 세션 설정 ══════════ -->
    <aside class="md:w-72 shrink-0 bg-slate-900/80 border-b md:border-b-0 md:border-r border-slate-800 flex flex-col max-h-56 md:max-h-none">
        <div class="p-4 md:p-5 pb-3 space-y-4">
            <div class="flex items-center gap-2.5">
                <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-indigo-500 to-violet-600 flex items-center justify-center text-sm font-bold shadow-lg shadow-indigo-950">O</div>
                <div>
                    <h1 class="text-sm font-semibold tracking-tight">Orchestrator Chat</h1>
                    <p class="text-[10px] text-slate-500">LangGraph 체크포인트 대화</p>
                </div>
            </div>

            <button onclick="createRoom()"
                    class="w-full py-2 bg-indigo-600 hover:bg-indigo-500 rounded-lg text-xs font-semibold transition shadow-lg shadow-indigo-950/40">
                ＋ 새 채팅방
            </button>
        </div>

        <!-- 채팅방 목록 -->
        <nav id="room-list" class="chat-scroll flex-1 overflow-y-auto px-3 space-y-1 min-h-0"></nav>

        <!-- 세션 설정 -->
        <div class="p-4 md:p-5 pt-3 space-y-3 border-t border-slate-800/70">
            <div>
                <label class="block text-[11px] font-medium text-slate-400 mb-1.5">모델</label>
                <select id="model-select" onchange="onModelChanged()"
                        class="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-2 text-xs focus:outline-none focus:ring-1 focus:ring-indigo-500 focus:border-indigo-500 transition">
                    <option value="">(기본 모델)</option>
                </select>
            </div>
            <div>
                <label class="block text-[11px] font-medium text-slate-400 mb-1.5">백엔드 API URL</label>
                <input id="api-url" type="text" value="http://localhost:8002"
                       class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-xs focus:outline-none focus:ring-1 focus:ring-indigo-500 focus:border-indigo-500 transition">
            </div>
            <div>
                <label class="block text-[11px] font-medium text-slate-400 mb-1.5">Thread ID <span class="text-slate-600">(현재 방)</span></label>
                <input id="thread-id" type="text" readonly
                       class="w-full bg-slate-950/60 border border-slate-800 rounded-lg px-3 py-2 text-[10px] font-mono text-slate-500 focus:outline-none">
            </div>
            <button onclick="resetSession()"
                    class="w-full py-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-lg text-xs font-medium text-slate-300 transition">
                현재 세션 초기화
            </button>
        </div>
    </aside>

    <!-- ══════════ 우측 메인 : 채팅 영역 ══════════ -->
    <main class="flex-1 flex flex-col min-h-0">

        <!-- 상단 바 -->
        <header class="shrink-0 h-14 px-4 md:px-6 bg-slate-900/60 border-b border-slate-800 flex items-center justify-between backdrop-blur">
            <div class="flex items-center gap-2 min-w-0">
                <span id="header-room-title" class="text-xs font-medium text-slate-200 truncate max-w-[180px]">—</span>
                <span class="text-slate-700">·</span>
                <code id="header-thread-id" class="text-[11px] text-slate-500 font-mono truncate">—</code>
                <span id="header-model" class="text-[10px] px-2 py-0.5 rounded-full bg-slate-800 border border-slate-700 text-slate-400 shrink-0">기본 모델</span>
            </div>
            <div class="flex items-center gap-2 shrink-0">
                <span id="status-dot" class="w-2 h-2 rounded-full bg-slate-600"></span>
                <span id="status-text" class="text-[11px] text-slate-400">대기</span>
            </div>
        </header>

        <!-- 중앙 대화창 -->
        <div id="message-feed" class="chat-scroll flex-1 overflow-y-auto px-4 md:px-6 py-5 space-y-4"></div>

        <!-- 하단 입력 바 -->
        <footer class="shrink-0 border-t border-slate-800 bg-slate-900/60 backdrop-blur p-3 md:p-4">
            <div class="max-w-3xl mx-auto flex items-end gap-2.5">
                <textarea id="chat-input" rows="1" placeholder="메시지 입력…  (Enter 전송 · Shift+Enter 줄바꿈)"
                          class="flex-1 bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-sm resize-none max-h-40 focus:outline-none focus:ring-1 focus:ring-indigo-500 focus:border-indigo-500 transition placeholder:text-slate-600"></textarea>
                <button id="send-button" onclick="sendMessage()"
                        class="shrink-0 w-11 h-11 rounded-xl bg-indigo-600 hover:bg-indigo-500 disabled:opacity-40 disabled:cursor-not-allowed flex items-center justify-center transition shadow-lg shadow-indigo-950/50">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5"><path d="M3.478 2.404a.75.75 0 0 0-.926.941l2.432 7.905H13.5a.75.75 0 0 1 0 1.5H4.984l-2.432 7.905a.75.75 0 0 0 .926.94 60.519 60.519 0 0 0 18.445-8.986.75.75 0 0 0 0-1.218A60.517 60.517 0 0 0 3.478 2.404Z"/></svg>
                </button>
            </div>
        </footer>
    </main>
</div>

<script>
/* ══════════════════ 채팅방 상태 (localStorage 영속화) ══════════════════ */

const ROOM_STORAGE_KEY = "orchestrator_chat_rooms_v1";

let roomList      = [];     // [{roomId, threadId, title, model, messages: [{role: "user"|"agent"|"error", text}]}]
let activeRoomId  = null;
let isStreaming   = false;

const messageFeed = document.getElementById("message-feed");
const chatInput   = document.getElementById("chat-input");
const sendButton  = document.getElementById("send-button");

function saveRooms() {
    localStorage.setItem(ROOM_STORAGE_KEY, JSON.stringify({ roomList, activeRoomId }));
}

function loadRooms() {
    try {
        const stored = JSON.parse(localStorage.getItem(ROOM_STORAGE_KEY));
        if (stored && Array.isArray(stored.roomList) && stored.roomList.length > 0) {
            roomList     = stored.roomList;
            activeRoomId = stored.roomList.some(room => room.roomId === stored.activeRoomId) ? stored.activeRoomId : stored.roomList[0].roomId;
            return;
        }
    } catch (_ignored) {}
    roomList = [];
    createRoom();   // 저장된 방이 없으면 첫 방 자동 생성
}

function getActiveRoom() { return roomList.find(room => room.roomId === activeRoomId); }

function createRoom() {
    const room = { roomId : crypto.randomUUID(), threadId : crypto.randomUUID(), title : "새 대화", model : "", messages : [] };
    roomList.unshift(room);
    activeRoomId = room.roomId;
    saveRooms();
    renderRoomList();
    renderActiveRoom();
}

function switchRoom(roomId) {
    if (isStreaming) return;   // 스트리밍 중 방 전환 방지 (응답이 다른 방에 섞이는 것을 막는다)
    activeRoomId = roomId;
    saveRooms();
    renderRoomList();
    renderActiveRoom();
}

function deleteRoom(event, roomId) {
    event.stopPropagation();
    if (isStreaming) return;
    roomList = roomList.filter(room => room.roomId !== roomId);
    if (roomList.length === 0) { createRoom(); return; }
    if (activeRoomId === roomId) activeRoomId = roomList[0].roomId;
    saveRooms();
    renderRoomList();
    renderActiveRoom();
}

function resetSession() {
    // 현재 방의 Thread 를 새로 발급 (체크포인트와 분리된 새 대화) + 메시지 피드 초기화
    if (isStreaming) return;
    const room = getActiveRoom();
    room.threadId = crypto.randomUUID();
    room.messages = [];
    room.title    = "새 대화";
    saveRooms();
    renderRoomList();
    renderActiveRoom();
    appendSystemNotice("새 세션이 시작되었습니다. 이전 체크포인트와 분리된 새 Thread 입니다.");
}

/* ══════════════════ 렌더링 ══════════════════ */

function renderRoomList() {
    const roomListElement = document.getElementById("room-list");
    roomListElement.innerHTML = "";
    for (const room of roomList) {
        const isActive = room.roomId === activeRoomId;
        const item = document.createElement("div");
        item.className = `group flex items-center gap-2 px-3 py-2 rounded-lg cursor-pointer transition text-xs ${isActive ? "bg-slate-800 border border-slate-700 text-slate-100" : "text-slate-400 hover:bg-slate-800/60 border border-transparent"}`;
        item.onclick   = () => switchRoom(room.roomId);

        const title = document.createElement("span");
        title.className   = "flex-1 truncate";
        title.textContent = room.title;

        const modelTag = document.createElement("span");
        modelTag.className   = "text-[9px] text-slate-600 shrink-0";
        modelTag.textContent = room.model ? room.model.split(":")[0] : "";

        const deleteButton = document.createElement("button");
        deleteButton.className   = "shrink-0 w-5 h-5 rounded flex items-center justify-center text-slate-600 hover:text-red-400 hover:bg-slate-700/60 opacity-0 group-hover:opacity-100 transition";
        deleteButton.textContent = "✕";
        deleteButton.title       = "채팅방 삭제";
        deleteButton.onclick     = (event) => deleteRoom(event, room.roomId);

        item.append(title, modelTag, deleteButton);
        roomListElement.appendChild(item);
    }
}

function renderActiveRoom() {
    const room = getActiveRoom();
    document.getElementById("thread-id").value              = room.threadId;
    document.getElementById("header-thread-id").textContent = room.threadId.slice(0, 13) + "…";
    document.getElementById("header-room-title").textContent = room.title;
    document.getElementById("header-model").textContent      = room.model || "기본 모델";
    document.getElementById("model-select").value            = room.model;
    setStatus("대기", "bg-slate-600");

    messageFeed.innerHTML = "";
    if (room.messages.length === 0) {
        messageFeed.innerHTML = `<div class="text-center pt-10">
            <p class="text-slate-600 text-sm">메시지를 보내 오케스트레이터와 대화를 시작하세요.</p>
            <p class="text-slate-700 text-[11px] mt-1.5">백엔드 : <code class="font-mono">python src/think_bottleneck_monitor.py</code> (포트 8002)</p></div>`;
        return;
    }
    for (const storedMessage of room.messages) {
        if (storedMessage.role === "user")       appendUserBubble(storedMessage.text, false);
        else if (storedMessage.role === "error") appendAgentBubble().markError(storedMessage.text);
        else                                     { const bubble = appendAgentBubble(); bubble.setStoredReasoning(storedMessage.reasoning); bubble.appendText(storedMessage.text); bubble.finalize(); }
    }
    scrollFeedToBottom();
}

function onModelChanged() {
    const room = getActiveRoom();
    room.model = document.getElementById("model-select").value;
    document.getElementById("header-model").textContent = room.model || "기본 모델";
    saveRooms();
    renderRoomList();
}

async function loadModelOptions(retryCount = 5) {
    // 백엔드 GET /models 로 Ollama 설치 모델을 드롭다운에 채운다.
    // 백엔드보다 페이지를 먼저 연 경우를 위해 실패 시 3초 간격으로 재시도한다 (최종 실패 시 기본 모델로 동작)
    const apiUrl = document.getElementById("api-url").value.trim().replace(/\/+$/, "");
    try {
        const response = await fetch(`${apiUrl}/models`);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const result      = await response.json();
        const modelSelect = document.getElementById("model-select");
        modelSelect.innerHTML = `<option value="">(기본 : ${result.default_model})</option>`;
        for (const modelName of result.models) {
            const option = document.createElement("option");
            option.value = modelName;
            option.textContent = modelName;
            modelSelect.appendChild(option);
        }
        modelSelect.value = getActiveRoom()?.model || "";
    } catch (error) {
        if (retryCount > 0) { setTimeout(() => loadModelOptions(retryCount - 1), 3000); return; }
        appendSystemNotice(`모델 목록 로드 실패 (${error.message}) — 기본 모델로 동작합니다.`);
    }
}

/* ══════════════════ 말풍선 렌더링 ══════════════════ */

function setStatus(text, colorClass) {
    document.getElementById("status-text").textContent = text;
    document.getElementById("status-dot").className    = `w-2 h-2 rounded-full ${colorClass}`;
}

function scrollFeedToBottom() { messageFeed.scrollTop = messageFeed.scrollHeight; }

function appendSystemNotice(text) {
    const notice = document.createElement("div");
    notice.className   = "text-center text-[11px] text-slate-600 py-1";
    notice.textContent = text;
    messageFeed.appendChild(notice);
    scrollFeedToBottom();
}

function appendUserBubble(text, animate = true) {
    const row = document.createElement("div");
    row.className = "flex justify-end" + (animate ? " bubble-enter" : "");
    row.innerHTML = `<div class="max-w-[78%] md:max-w-[65%] bg-slate-700 rounded-2xl rounded-br-md px-4 py-2.5 text-sm leading-relaxed whitespace-pre-wrap shadow"></div>`;
    row.firstElementChild.textContent = text;
    messageFeed.appendChild(row);
    scrollFeedToBottom();
}

function appendAgentBubble() {
    // 스트리밍 누적용 말풍선 : 첫 토큰 전에는 타이핑 인디케이터, 생각 과정은 접이식 섹션에 실시간 표시.
    // 말풍선 아래 메타라인에 경과 시간·토큰 수를 라이브로 갱신한다 (Ollama 는 청크당 1토큰 스트리밍 → 이벤트 수 = 토큰 수)
    const row = document.createElement("div");
    row.className = "flex justify-start bubble-enter";
    // 주의 : 답변 영역은 whitespace-pre-wrap 이므로 태그 사이에 개행/들여쓰기를 넣으면 여백으로 렌더링된다
    row.innerHTML = `<div class="flex flex-col items-start max-w-[78%] md:max-w-[65%]"><div class="bg-slate-800 border border-slate-700/60 rounded-2xl rounded-bl-md px-4 py-2.5 text-sm leading-relaxed shadow w-fit min-w-0"><details class="reasoning-details hidden mb-1.5 -mx-1"><summary class="cursor-pointer select-none text-[11px] text-slate-500 hover:text-slate-300 transition px-1"> reasoning-status <span class="reasoning-status text-slate-600"></span></summary><div class="reasoning-text chat-scroll whitespace-pre-wrap text-[11px] leading-relaxed text-slate-500 bg-slate-950/50 border border-slate-800 rounded-lg px-2.5 py-2 mt-1 max-h-36 overflow-y-auto"></div></details><span class="typing-indicator inline-flex gap-1 items-center py-1"><span class="typing-dot w-1.5 h-1.5 rounded-full bg-slate-400"></span><span class="typing-dot w-1.5 h-1.5 rounded-full bg-slate-400"></span><span class="typing-dot w-1.5 h-1.5 rounded-full bg-slate-400"></span></span><span class="agent-text whitespace-pre-wrap"></span></div><div class="meta-line hidden text-[10px] text-slate-600 mt-1 px-1 font-mono"></div></div>`;
    messageFeed.appendChild(row);
    scrollFeedToBottom();
    const reasoningDetails = row.querySelector(".reasoning-details");
    const reasoningText    = row.querySelector(".reasoning-text");
    const metaLine         = row.querySelector(".meta-line");

    // 라이브 메타 상태 (경과 시간 타이머 + 토큰 카운터)
    let liveStartedAt        = null;
    let liveTimerId          = null;
    let reasoningTokenCount  = 0;
    let answerTokenCount     = 0;

    const formatElapsedSeconds = () => liveStartedAt === null ? "0.0" : ((performance.now() - liveStartedAt) / 1000).toFixed(1);
    const renderMetaLine = () => {
        metaLine.classList.remove("hidden");
        metaLine.textContent = `⏱ ${formatElapsedSeconds()}s · 생각 ${reasoningTokenCount} 토큰 · 응답 ${answerTokenCount} 토큰`;
        if (!reasoningDetails.classList.contains("hidden") && reasoningDetails.open) {
            row.querySelector(".reasoning-status").textContent = `(생각 중… ${formatElapsedSeconds()}s · ${reasoningTokenCount} 토큰)`;
        }
    };

    return {
        startLiveMeta : () => {
            // 전송 직후 호출 : 0.1초 간격으로 경과 시간을 갱신한다 (클로드식 실시간 카운터)
            liveStartedAt = performance.now();
            liveTimerId   = setInterval(renderMetaLine, 100);
            renderMetaLine();
        },
        getMeta : () => ({ elapsed_second_text : formatElapsedSeconds(), reasoning_token_count : reasoningTokenCount, answer_token_count : answerTokenCount }),
        setStoredMeta : (storedMeta) => {
            // 방 전환 복원용 : 고정 메타라인만 표시 (타이머 없음)
            if (!storedMeta) return;
            metaLine.classList.remove("hidden");
            metaLine.textContent = `⏱ ${storedMeta.elapsed_second_text}s · 생각 ${storedMeta.reasoning_token_count} 토큰 · 응답 ${storedMeta.answer_token_count} 토큰`;
        },
        appendReasoning : (chunkText) => {
            // 생각 과정 실시간 누적 : 첫 조각에서 섹션을 펼치고, 내부 스크롤을 따라간다 (대기 지루함 해소)
            if (reasoningDetails.classList.contains("hidden")) {
                reasoningDetails.classList.remove("hidden");
                reasoningDetails.open = true;
                row.querySelector(".reasoning-status").textContent = "(생각 중…)";
            }
            reasoningText.textContent += chunkText;
            reasoningText.scrollTop = reasoningText.scrollHeight;
            scrollFeedToBottom();
        },
        setStoredReasoning : (storedText) => {
            // 방 전환 복원용 : 접힌 상태로 생각 과정을 채워 넣는다
            if (!storedText) return;
            reasoningDetails.classList.remove("hidden");
            reasoningDetails.open = false;
            reasoningText.textContent = storedText;
        },
        getReasoningText : () => reasoningText.textContent,
        appendText : (chunkText) => {
            const agentText = row.querySelector(".agent-text");
            if (agentText.textContent === "") {
                chunkText = chunkText.replace(/^\s+/, "");  // 선두 개행/공백 제거 (whitespace-pre-wrap 말풍선 부풀림 방지)
                // 첫 답변 토큰 도착 : 생각 과정은 자동으로 접는다 (필요하면 다시 펼쳐볼 수 있다)
                if (!reasoningDetails.classList.contains("hidden")) {
                    reasoningDetails.open = false;
                    row.querySelector(".reasoning-status").textContent = "";
                }
            }
            if (chunkText === "") return;
            const indicator = row.querySelector(".typing-indicator");
            if (indicator) indicator.remove();
            agentText.textContent += chunkText;
            scrollFeedToBottom();
        },
        finalize : () => {
            // 스트림 종료 시 : 후행 개행/공백 제거 + 빈 응답이면 인디케이터 대신 플레이스홀더 표시
            const indicator = row.querySelector(".typing-indicator");
            if (indicator) indicator.remove();
            reasoningDetails.open = false;
            row.querySelector(".reasoning-status").textContent = "";
            const agentText = row.querySelector(".agent-text");
            agentText.textContent = agentText.textContent.replace(/\s+$/, "");
            if (agentText.textContent === "") {
                agentText.textContent = "(빈 응답 — 모델이 텍스트를 생성하지 않았습니다)";
                agentText.classList.add("text-slate-500", "italic");
            }
            return agentText.textContent;
        },
        markError : (errorText) => {
            const indicator = row.querySelector(".typing-indicator");
            if (indicator) indicator.remove();
            const agentText = row.querySelector(".agent-text");
            agentText.textContent = errorText;
            agentText.classList.add("text-red-400");
            scrollFeedToBottom();
        }
    };
}

/* ══════════════════ 전송 + 스트리밍 수신 ══════════════════ */

async function sendMessage() {
    const apiUrl  = document.getElementById("api-url").value.trim().replace(/\/+$/, "");
    const message = chatInput.value.trim();
    const room    = getActiveRoom();
    if (!message || isStreaming || !room) return;

    // ① 사용자 메시지를 즉시 렌더링·저장하고 입력창을 비운다 (첫 메시지는 방 제목이 된다)
    appendUserBubble(message);
    room.messages.push({ role : "user", text : message });
    if (room.title === "새 대화") { room.title = message.slice(0, 24); renderRoomList(); document.getElementById("header-room-title").textContent = room.title; }
    saveRooms();
    chatInput.value        = "";
    chatInput.style.height = "auto";
    isStreaming            = true;
    sendButton.disabled    = true;
    setStatus("응답 중", "bg-emerald-400 animate-pulse");

    // ② 어시스턴트 말풍선을 미리 생성하고 스트리밍 텍스트를 누적한다
    const agentBubble = appendAgentBubble();

    try {
        const response = await fetch(`${apiUrl}/stream`, {
            method  : "POST",
            headers : { "Content-Type" : "application/json" },
            body    : JSON.stringify({ thread_id : room.threadId, message : message, model : room.model || null, include_reasoning : true })
        });
        if (!response.ok || !response.body) throw new Error(`HTTP ${response.status}`);

        // NDJSON 이벤트 스트림 파싱 : {"type":"reasoning","text":...} 는 생각 과정 섹션에,
        // {"type":"token","text":...} 는 답변 본문에 실시간 누적한다
        const streamReader = response.body.getReader();
        const textDecoder  = new TextDecoder("utf-8");
        let   lineBuffer   = "";
        const dispatchEventLine = (eventLine) => {
            if (!eventLine.trim()) return;
            try {
                const streamEvent = JSON.parse(eventLine);
                if (streamEvent.type === "reasoning")  agentBubble.appendReasoning(streamEvent.text);
                else if (streamEvent.type === "token") agentBubble.appendText(streamEvent.text);
            } catch (_ignored) { agentBubble.appendText(eventLine); }   // NDJSON 이 아닌 서버(구버전) 폴백
        };
        while (true) {
            const { done, value } = await streamReader.read();
            if (done) break;
            lineBuffer += textDecoder.decode(value, { stream : true });
            const completeLines = lineBuffer.split("\n");
            lineBuffer = completeLines.pop();   // 마지막 조각은 미완성 라인일 수 있으므로 버퍼에 남긴다
            completeLines.forEach(dispatchEventLine);
        }
        dispatchEventLine(lineBuffer);   // 종료 후 잔여 버퍼 처리

        const finalText = agentBubble.finalize();
        room.messages.push({ role : "agent", text : finalText, reasoning : agentBubble.getReasoningText() });
        saveRooms();
        setStatus("대기", "bg-slate-600");
    } catch (error) {
        const errorText = `응답 실패 : ${error.message} — 백엔드가 실행 중인지 확인하세요.`;
        agentBubble.markError(errorText);
        room.messages.push({ role : "error", text : errorText });
        saveRooms();
        setStatus("오류", "bg-red-500");
    } finally {
        isStreaming         = false;
        sendButton.disabled = false;
        chatInput.focus();
    }
}

/* ══════════════════ 입력 UX ══════════════════ */

// Enter 전송 / Shift+Enter 줄바꿈
chatInput.addEventListener("keydown", (event) => {
    if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
    }
});

// textarea 자동 높이
chatInput.addEventListener("input", () => {
    chatInput.style.height = "auto";
    chatInput.style.height = Math.min(chatInput.scrollHeight, 160) + "px";
});

/* ══════════════════ 초기화 ══════════════════ */
loadRooms();
renderRoomList();
renderActiveRoom();
loadModelOptions();
chatInput.focus();
</script>

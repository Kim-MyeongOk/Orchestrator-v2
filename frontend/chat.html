                metaLine.classList.remove("hidden");
                metaLine.textContent = `⏱ ${storedMeta.elapsed_second_text}s · 생각 ${storedMeta.reasoning_token_count} 토큰 · 응답 ${storedMeta.answer_token_count} 토큰`;
            }
        },
        appendReasoning : (chunkText) => {
            // 생각 과정 실시간 누적 : 첫 조각에서 섹션을 펼치고, 내부 스크롤을 따라간다 (대기 지루함 해소)
            clearRetryNotice();
            if (reasoningDetails.classList.contains("hidden")) {
                reasoningDetails.classList.remove("hidden");
                reasoningDetails.open = true;
            }
            reasoningTokenCount += 1;
            reasoningText.textContent += chunkText;
            reasoningText.scrollTop = reasoningText.scrollHeight;
            scrollFeedToBottom();
        },
        setStoredReasoning : (storedText) => {
            // 방 전환 복원용 : 접힌 상태로 생각 과정을 채워 넣는다
            if (!storedText) return;
            reasoningDetails.classList.remove("hidden");
            reasoningDetails.open = false;
            reasoningText.textContent = storedText;
        },
        getReasoningText : () => reasoningText.textContent,
        appendText : (chunkText) => {
            clearRetryNotice();
            const agentText = row.querySelector(".agent-text");
            if (agentText.textContent === "") {
                chunkText = chunkText.replace(/^\s+/, "");  // 선두 개행/공백 제거 (whitespace-pre-wrap 말풍선 부풀림 방지)
                // 첫 답변 토큰 도착 : 생각 과정은 자동으로 접는다 (필요하면 다시 펼쳐볼 수 있다)
                if (!reasoningDetails.classList.contains("hidden")) {
                    reasoningDetails.open = false;
                    row.querySelector(".reasoning-status").textContent = "";
                }
            }
            if (chunkText === "") return;
            const indicator = row.querySelector(".typing-indicator");
            if (indicator) indicator.remove();
            if (liveTimerId !== null) answerTokenCount += 1;   // 라이브 스트리밍 중일 때만 카운트 (복원 렌더링은 제외)
            agentText.textContent += chunkText;
            scrollFeedToBottom();
        },
        hasReceivedAnyText : () => reasoningText.textContent !== "" || row.querySelector(".agent-text").textContent !== "",
        markRetrying : (noticeText) => {
            // 자동 재시도 대기 표시 : 말풍선 안에 앰버색 안내를 띄운다 (다음 시도 데이터 도착 시 자동 제거)
            retryNotice.classList.remove("hidden");
            retryNotice.textContent = noticeText;
            scrollFeedToBottom();
        },
        finalize : () => {
            // 스트림 종료 시 : 타이머 정지 + 완료 시각 기록 + 후행 공백 제거 + 빈 응답이면 플레이스홀더 표시
            if (liveTimerId !== null) { clearInterval(liveTimerId); liveTimerId = null; }
            clearRetryNotice();
            const indicator = row.querySelector(".typing-indicator");
            if (indicator) indicator.remove();
            reasoningDetails.open = false;
            row.querySelector(".reasoning-status").textContent = "";
            recordCompletion();   // 완료 시각 기록 + 메타라인 렌더 (일반: 상대 시간 / 개발자: 절대 시각 + 토큰)
            const agentText = row.querySelector(".agent-text");
            const rawAnswerText = agentText.textContent.replace(/\s+$/, "");   // 저장·반환용 원문(마크다운 소스)
            if (rawAnswerText === "") {
                agentText.textContent = "(빈 응답 — 모델이 텍스트를 생성하지 않았습니다)";
                agentText.classList.add("text-slate-500", "italic");
                return rawAnswerText;
            }
            // 원문을 마크다운으로 렌더링해 표시한다 (스트리밍 중엔 raw, 완료 시 서식 적용)
            agentText.classList.remove("whitespace-pre-wrap");   // 마크다운은 자체 여백을 쓰므로 pre-wrap 해제
            agentText.classList.add("md-body");
            agentText.innerHTML = renderMarkdownToHtml(rawAnswerText);
            // 복사 버튼을 시간(메타라인)과 같은 행(.agent-footer)의 맨 앞에 둔다 (finalize 재호출 시 중복 방지)
            const answerFooter = row.querySelector(".agent-footer");
            if (answerFooter && !answerFooter.querySelector(".answer-copy-button")) {
                answerFooter.insertBefore(createAnswerCopyButton(rawAnswerText), answerFooter.firstChild);
            }
            return rawAnswerText;   // room.messages 에는 원문(마크다운)을 저장한다
        },
        markError : (errorText, onManualRetry = null) => {
            if (liveTimerId !== null) { clearInterval(liveTimerId); liveTimerId = null; metaLine.classList.add("hidden"); }
            clearRetryNotice();
            const indicator = row.querySelector(".typing-indicator");
            if (indicator) indicator.remove();
            const agentText = row.querySelector(".agent-text");
            agentText.textContent = errorText;
            agentText.classList.add("text-red-500", "dark:text-red-400");
            if (onManualRetry) {
                // 최종 실패 : 수동 재시도 버튼 제공 (클릭 시 이 에러 말풍선을 제거하고 같은 메시지로 재전송)
                const retryButton = document.createElement("button");
                retryButton.className   = "mt-2 block px-3 py-1.5 rounded-lg text-[11px] font-medium bg-red-100 hover:bg-red-200 text-red-700 dark:bg-red-950/60 dark:hover:bg-red-900/60 dark:text-red-300 border border-red-300 dark:border-red-800 transition";
                retryButton.textContent = "↻ 다시 시도";
                retryButton.onclick     = () => { row.remove(); onManualRetry(); };
                agentText.after(retryButton);
            }
            scrollFeedToBottom();
        }
    };
}

/* ══════════════════ 전송 + 스트리밍 수신 (지수 백오프 자동 재시도) ══════════════════ */

const STREAM_MAX_RETRY_COUNT   = 3;      // 최대 자동 재시도 횟수
const STREAM_BASE_DELAY_MS     = 1000;   // 지수 백오프 기본 간격 : 1초 → 2초 → 4초

class NonRetryableError extends Error {}  // 4xx 등 재시도가 무의미한 오류

function sleepAsync(delayMs) { return new Promise(resolve => setTimeout(resolve, delayMs)); }

/* ══════════════════ 전송 / 중단 버튼 (스트리밍 중에는 중단 버튼으로 전환) ══════════════════ */

let currentAbortController = null;   // 진행 중인 스트림을 사용자가 중단할 수 있게 보관

const SEND_ICON_SVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5"><path d="M3.478 2.404a.75.75 0 0 0-.926.941l2.432 7.905H13.5a.75.75 0 0 1 0 1.5H4.984l-2.432 7.905a.75.75 0 0 0 .926.94 60.519 60.519 0 0 0 18.445-8.986.75.75 0 0 0 0-1.218A60.517 60.517 0 0 0 3.478 2.404Z"/></svg>`;
const STOP_ICON_SVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-4 h-4"><rect x="5" y="5" width="14" height="14" rx="2.5"/></svg>`;

function onSendOrStopClick() {
    // 스트리밍 중이면 중단, 아니면 전송
    if (isStreaming) stopStreaming();
    else             sendMessage();
}

function stopStreaming() {
    if (currentAbortController) currentAbortController.abort();
}

function updateSendButtonMode() {
    // 스트리밍 여부에 따라 전송 버튼 ↔ 중단(빨강) 버튼을 전환한다
    sendButton.disabled = false;   // 중단하려면 클릭 가능해야 하므로 항상 활성
    sendButton.classList.toggle("bg-red-600",        isStreaming);
    sendButton.classList.toggle("hover:bg-red-500",  isStreaming);
    sendButton.classList.toggle("bg-indigo-600",     !isStreaming);
    sendButton.classList.toggle("hover:bg-indigo-500", !isStreaming);
    sendButton.title     = isStreaming ? "응답 중단" : "전송";
    sendButton.innerHTML = isStreaming ? STOP_ICON_SVG : SEND_ICON_SVG;
}

async function sendMessage() {
    const message = chatInput.value.trim();
    const room    = getActiveRoom();
    if (!message || isStreaming || !room) return;

    // ① 사용자 메시지를 즉시 렌더링·저장하고 입력창을 비운다 (첫 메시지는 방 제목이 된다)
    if (room.messages === null) room.messages = [];   // 서버 복원이 끝나기 전 전송한 경우 : 빈 목록으로 시작
    appendUserBubble(message, true, room.messages.filter(storedMessage => storedMessage.role === "user").length);   // 순번 = 기존 사용자 메시지 수
    room.messages.push({ role : "user", text : message });
    if (room.title === "새 대화") { room.title = message.slice(0, 24); renderRoomList(); document.getElementById("header-room-title").textContent = room.title; syncRoomToServerAsync(room); }
    saveRooms();
    chatInput.value        = "";
    chatInput.style.height = "auto";

    await executeStreamTurnAsync(room, message);
}

async function executeStreamTurnAsync(room, message) {
    // 스트리밍 1턴 실행 : 5xx/네트워크 오류 시 지수 백오프로 자동 재시도하고,
    // 최종 실패 시 토스트 + 수동 재시도 버튼을 제공한다.
    const apiUrl           = document.getElementById("api-url").value.trim().replace(/\/+$/, "");
    isStreaming            = true;
    currentAbortController = new AbortController();   // 이 턴을 중단할 수 있게 한다
    updateSendButtonMode();                           // 전송 버튼 → 중단 버튼
    renderRoomList();                                 // 응답 중인 방의 이름변경 버튼을 비활성 표시로 갱신
    setStatus("응답 중", "bg-emerald-400 animate-pulse");

    // ② 어시스턴트 말풍선을 미리 생성하고 스트리밍 텍스트를 누적한다 (경과 시간·토큰 카운터 즉시 시작)
    const agentBubble = appendAgentBubble();
    agentBubble.startLiveMeta();

    let attemptCount = 0;
    while (true) {
        try {
            const response = await fetch(`${apiUrl}/stream`, {
                method  : "POST",
                headers : { "Content-Type" : "application/json" },
                body    : JSON.stringify({ thread_id : room.threadId, message : message, model : room.model || null, reasoning_effort : room.reasoningEffort || null, include_reasoning : true }),
                signal  : currentAbortController.signal
            });
            if (!response.ok || !response.body) {
                // 서버가 준 에러 상세(본문)를 함께 담는다 (개발자 모드에서 실제 오류명과 함께 노출)
                let serverDetailText = "";
                try { serverDetailText = (await response.text()).trim().slice(0, 800); } catch (_ignored) {}
                const httpError = response.status >= 500 ? new Error(`HTTP ${response.status} (서버 오류)`) : new NonRetryableError(`HTTP ${response.status}`);
                httpError.serverDetail = serverDetailText;
                throw httpError;   // 5xx → 재시도 대상(Error), 4xx → 즉시 실패(NonRetryableError)
            }

            // NDJSON 이벤트 스트림 파싱 : {"type":"reasoning","text":...} 는 생각 과정 섹션에,
            // {"type":"token","text":...} 는 답변 본문에 실시간 누적한다
            // Run ID : 헤더로도 내려온다 (include_reasoning=false 라 start 이벤트가 없는 경우의 폴백)
            const responseRunId = response.headers.get("X-Run-Id");
            if (responseRunId) { room.lastRunId = responseRunId; saveRooms(); refreshDebugTabs(); }

            const streamReader = response.body.getReader();
            const textDecoder  = new TextDecoder("utf-8");
            let   lineBuffer   = "";
            let   streamErrorText = null;   // 서버가 스트림 도중 보고한 오류(예: 429 quota) 를 담는다
            const dispatchEventLine = (eventLine) => {
                if (!eventLine.trim()) return;
                try {
                    const streamEvent = JSON.parse(eventLine);
                    if (streamEvent.type === "start")      { room.lastRunId = streamEvent.run_id; saveRooms(); refreshDebugTabs(); }   // 이번 턴의 Run ID
                    else if (streamEvent.type === "reasoning")  agentBubble.appendReasoning(streamEvent.text);
                    else if (streamEvent.type === "token") agentBubble.appendText(streamEvent.text);
                    else if (streamEvent.type === "error") streamErrorText = streamEvent.text;   // 200 스트림 본문으로 온 오류
                } catch (_ignored) { agentBubble.appendText(eventLine); }   // NDJSON 이 아닌 서버(구버전) 폴백
            };
            while (true) {
                const { done, value } = await streamReader.read();
                if (done) break;
                lineBuffer += textDecoder.decode(value, { stream : true });
                const completeLines = lineBuffer.split("\n");
                lineBuffer = completeLines.pop();   // 마지막 조각은 미완성 라인일 수 있으므로 버퍼에 남긴다
                completeLines.forEach(dispatchEventLine);
            }
            dispatchEventLine(lineBuffer);   // 종료 후 잔여 버퍼 처리

            // 서버가 스트림 도중 오류를 보고한 경우 : 성공 저장 대신 오류로 처리한다 (개발자 모드는 원문 노출)
            if (streamErrorText !== null) {
                const shownError = isDeveloperModeEnabled()
                    ? `응답 오류 : ${streamErrorText}`
                    : "응답 오류 : 서버가 응답을 생성하지 못했습니다. 잠시 후 다시 시도해주세요.";
                if (agentBubble.hasReceivedAnyText()) {
                    // 일부 답변을 이미 받았으면 그 부분은 보존하고 오류는 별도 안내로 남긴다
                    const partialText = agentBubble.finalize();
                    room.messages.push({ role : "agent", text : partialText, reasoning : agentBubble.getReasoningText(), meta : agentBubble.getMeta() });
                    appendSystemNotice(shownError);
                    room.messages.push({ role : "error", text : shownError });
                } else {
                    agentBubble.markError(shownError, () => {
                        if (isStreaming) return;
                        room.messages = room.messages.filter(storedMessage => !(storedMessage.role === "error" && storedMessage.text === shownError));
                        saveRooms();
                        executeStreamTurnAsync(room, message);   // 같은 메시지로 재전송 (quota 는 잠시 후 회복)
                    });
                    room.messages.push({ role : "error", text : shownError });
                }
                saveRooms();
                setStatus("오류", "bg-red-500");
                showToast(`⚠ ${isDeveloperModeEnabled() ? streamErrorText : "서버 응답 오류 — 잠시 후 다시 시도해주세요."}`);
                break;
            }

            const finalText = agentBubble.finalize();
            room.messages.push({ role : "agent", text : finalText, reasoning : agentBubble.getReasoningText(), meta : agentBubble.getMeta() });
            saveRooms();
            setStatus("대기", "bg-slate-400 dark:bg-slate-600");
            break;
        } catch (error) {
            // 사용자가 중단(Stop) : 재시도·에러 표시 없이 지금까지 받은 내용을 확정하고 조용히 종료한다
            if (error.name === "AbortError") {
                if (agentBubble.hasReceivedAnyText()) {
                    const partialText = agentBubble.finalize();
                    room.messages.push({ role : "agent", text : partialText, reasoning : agentBubble.getReasoningText(), meta : agentBubble.getMeta() });
                } else {
                    agentBubble.markError("응답을 중단했습니다.");
                    room.messages.push({ role : "error", text : "응답을 중단했습니다." });
                }
                saveRooms();
                setStatus("중단됨", "bg-slate-400 dark:bg-slate-600");
                break;
            }
            // 자동 재시도 조건 : 재시도 가능 오류 + 아직 아무 데이터도 못 받음(중복 응답 방지) + 횟수 남음
            const isRetryable = !(error instanceof NonRetryableError) && !agentBubble.hasReceivedAnyText() && attemptCount < STREAM_MAX_RETRY_COUNT;
            if (isRetryable) {
                attemptCount += 1;
                const backoffDelayMs = STREAM_BASE_DELAY_MS * 2 ** (attemptCount - 1);   // 1초 → 2초 → 4초
                agentBubble.markRetrying(`연결 실패 — ${backoffDelayMs / 1000}초 후 자동 재시도 (${attemptCount}/${STREAM_MAX_RETRY_COUNT})`);
                setStatus(`재연결 ${attemptCount}/${STREAM_MAX_RETRY_COUNT}`, "bg-amber-400 animate-pulse");
                await sleepAsync(backoffDelayMs);
                continue;
            }
            // 최종 실패 : 에러 말풍선 + 토스트 + 수동 재시도 버튼
            const failReason = agentBubble.hasReceivedAnyText() ? "응답 중 연결이 끊겼습니다" : `응답 실패 : ${error.message}`;
            // 개발자 모드 : 일반 안내 대신 실제 오류명·메시지·서버 응답 상세를 그대로 노출한다
            let errorText;
            if (isDeveloperModeEnabled()) {
                const detailLineList = [`${failReason}`, `[${error.name || "Error"}] ${error.message}`];
                if (error.serverDetail) detailLineList.push(`서버 응답 : ${error.serverDetail}`);
                detailLineList.push(`(자동 재시도 ${attemptCount}회 시도)`);
                errorText = detailLineList.join("\n");
            } else {
                errorText = `${failReason} — 자동 재시도 ${attemptCount}회 모두 실패했거나 재시도할 수 없는 오류입니다.`;
            }
            agentBubble.markError(errorText, () => {
                if (isStreaming) return;
                room.messages = room.messages.filter(storedMessage => !(storedMessage.role === "error" && storedMessage.text === errorText));
                saveRooms();
                executeStreamTurnAsync(room, message);   // 같은 메시지로 재전송
            });
            room.messages.push({ role : "error", text : errorText });
            saveRooms();
            setStatus("오류", "bg-red-500");
            showToast(`⚠ ${failReason}\n백엔드(포트 8000) 실행 여부를 확인한 뒤 '다시 시도'를 눌러주세요.`);
            break;
        }
    }
    isStreaming            = false;
    currentAbortController = null;
    updateSendButtonMode();   // 중단 버튼 → 전송 버튼 복귀
    renderRoomList();         // 이름변경 버튼 다시 활성화
    chatInput.focus();
}

/* ══════════════════ 입력 UX ══════════════════ */

// Enter 전송 / Shift+Enter 줄바꿈
chatInput.addEventListener("keydown", (event) => {
    if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
    }
});

// textarea 자동 높이
chatInput.addEventListener("input", () => {
    chatInput.style.height = "auto";
    chatInput.style.height = Math.min(chatInput.scrollHeight, 160) + "px";
});

/* ══════════════════ 초기화 ══════════════════ */
(async function initializeApplication() {
    initializeUserId();                                                              // 사용자 ID 복원 (없으면 자동 발급)
    loadPanelState();                                                                // 패널 크기/접기 상태 복원
    applySidebarState();
    initializePanelResizeHandles();
    applyDeveloperMode(localStorage.getItem(DEVELOPER_MODE_STORAGE_KEY) === "on");   // 개발자 모드 저장값 복원 (기본 : 꺼짐, 디버그 패널 포함)
    await loadRoomsAsync();                                                          // 서버에서 유저별 방 목록 로드 (실패 시 로컬 캐시 폴백)
    renderRoomList();
    renderActiveRoom();
    loadModelOptions();
    refreshDebugTabs();                                                              // 방 로드 후 디버그 패널 데이터 갱신
    chatInput.focus();
})();
</script>
</body>
</html>

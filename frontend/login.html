<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로그인 — Orchestrator Chat</title>
<script>
/* [FOUC 방지] 저장된 테마(없으면 시스템)를 렌더 전에 주입한다. */
(function () {
    const storedTheme = localStorage.getItem("orchestrator_chat_theme");
    const isDark      = storedTheme ? storedTheme === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
    if (isDark) document.documentElement.classList.add("dark");
})();
</script>
<script>
/* 이미 로그인되어 있으면 곧장 채팅으로 보낸다. */
(function () {
    if (localStorage.getItem("orchestrator_chat_auth_user_id")) {
        location.replace("chat.html");
    }
})();
</script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
    html       { background : #f1f5f9; }
    html.dark  { background : #020617; }
</style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 bg-slate-100 dark:bg-slate-950 text-slate-900 dark:text-slate-100 font-sans antialiased">

<div class="w-full max-w-sm">
    <!-- 헤더 -->
    <div class="text-center mb-6">
        <div class="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-indigo-600 text-white text-xl font-bold shadow-lg mb-3">O</div>
        <h1 class="text-lg font-bold tracking-tight">Orchestrator Chat</h1>
        <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">사용자 ID 로 로그인하고 내 대화만 이어가세요</p>
    </div>

    <!-- 카드 -->
    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl shadow-xl p-5">
        <!-- 탭 -->
        <div class="flex gap-1 p-1 mb-4 rounded-xl bg-slate-100 dark:bg-slate-950/60">
            <button id="tab-login"    onclick="switchMode('login')"    class="flex-1 py-2 rounded-lg text-xs font-semibold transition">로그인</button>
            <button id="tab-register" onclick="switchMode('register')" class="flex-1 py-2 rounded-lg text-xs font-semibold transition">회원가입</button>
        </div>

        <form id="auth-form" onsubmit="return onSubmit(event)" class="space-y-3">
            <div>
                <label class="block text-[11px] font-medium text-slate-500 dark:text-slate-400 mb-1.5">사용자 ID</label>
                <input id="user-id" type="text" autocomplete="username" spellcheck="false" placeholder="예: alice"
                       class="w-full bg-white dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-1 focus:ring-indigo-500 focus:border-indigo-500 transition">
            </div>
            <div>
                <label class="block text-[11px] font-medium text-slate-500 dark:text-slate-400 mb-1.5">비밀번호</label>
                <input id="password" type="password" autocomplete="current-password" placeholder="비밀번호"
                       class="w-full bg-white dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-1 focus:ring-indigo-500 focus:border-indigo-500 transition">
            </div>
            <div id="password-confirm-row" class="hidden">
                <label class="block text-[11px] font-medium text-slate-500 dark:text-slate-400 mb-1.5">비밀번호 확인</label>
                <input id="password-confirm" type="password" autocomplete="new-password" placeholder="비밀번호 다시 입력"
                       class="w-full bg-white dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-1 focus:ring-indigo-500 focus:border-indigo-500 transition">
            </div>

            <p id="message-line" class="hidden text-[11px] leading-relaxed rounded-lg px-3 py-2"></p>

            <button id="submit-button" type="submit"
                    class="w-full py-2.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-semibold transition disabled:opacity-50 disabled:cursor-not-allowed">
                로그인
            </button>
        </form>
    </div>

    <p class="text-center text-[10px] text-slate-400 dark:text-slate-600 mt-4">비밀번호는 서버에 해시(PBKDF2)로만 저장됩니다</p>
</div>

<script>
/* 통합 백엔드(server.py, 기본 :8000)에 인증 요청을 보낸다. file:// 로 열면 localhost:8000 폴백. */
const API_BASE = location.origin.startsWith("http") ? location.origin : "http://localhost:8000";
const AUTH_USER_ID_STORAGE_KEY = "orchestrator_chat_auth_user_id";
const USER_ID_STORAGE_KEY      = "orchestrator_chat_user_id";

let currentMode = "login";   // "login" | "register"

const messageLine   = document.getElementById("message-line");
const submitButton  = document.getElementById("submit-button");
const tabLogin      = document.getElementById("tab-login");
const tabRegister   = document.getElementById("tab-register");

function switchMode(mode) {
    currentMode = mode;
    const isRegister = mode === "register";
    document.getElementById("password-confirm-row").classList.toggle("hidden", !isRegister);
    document.getElementById("password").setAttribute("autocomplete", isRegister ? "new-password" : "current-password");
    submitButton.textContent = isRegister ? "회원가입" : "로그인";
    hideMessage();
    // 탭 활성 스타일
    const activeClass   = ["bg-white", "dark:bg-slate-800", "text-indigo-600", "dark:text-indigo-400", "shadow"];
    const inactiveClass = ["text-slate-500"];
    const setTab = (tabElement, isActive) => {
        activeClass.forEach(className => tabElement.classList.toggle(className, isActive));
        inactiveClass.forEach(className => tabElement.classList.toggle(className, !isActive));
    };
    setTab(tabLogin, !isRegister);
    setTab(tabRegister, isRegister);
}

function showMessage(text, isError) {
    messageLine.textContent = text;
    messageLine.className = "text-[11px] leading-relaxed rounded-lg px-3 py-2 " + (isError
        ? "bg-red-50 dark:bg-red-950/50 text-red-600 dark:text-red-400 border border-red-200 dark:border-red-900"
        : "bg-emerald-50 dark:bg-emerald-950/50 text-emerald-600 dark:text-emerald-400 border border-emerald-200 dark:border-emerald-900");
}

function hideMessage() { messageLine.className = "hidden"; }

function friendlyError(statusCode, detailText) {
    // 서버 상태 코드를 사용자 친화적 한국어로 매핑 (원문 detail 은 개발 참고용)
    if (statusCode === 401) return "사용자 ID 또는 비밀번호가 올바르지 않습니다.";
    if (statusCode === 409) return "이미 존재하는 사용자 ID 입니다. 다른 ID 를 사용하거나 로그인하세요.";
    if (statusCode === 400) return "입력값을 확인하세요. (비밀번호는 4자 이상)";
    return `요청 실패 (${statusCode}) : ${detailText || "잠시 후 다시 시도하세요."}`;
}

function enterChat(userId) {
    localStorage.setItem(AUTH_USER_ID_STORAGE_KEY, userId);
    localStorage.setItem(USER_ID_STORAGE_KEY, userId);   // 방 목록 스코핑 키와 동기화
    location.replace("chat.html");
}

async function onSubmit(event) {
    event.preventDefault();
    const userId   = document.getElementById("user-id").value.trim();
    const password = document.getElementById("password").value;
    if (!userId || !password) { showMessage("사용자 ID 와 비밀번호를 입력하세요.", true); return false; }
    if (currentMode === "register") {
        const passwordConfirm = document.getElementById("password-confirm").value;
        if (password.length < 4)          { showMessage("비밀번호는 4자 이상이어야 합니다.", true); return false; }
        if (password !== passwordConfirm) { showMessage("비밀번호 확인이 일치하지 않습니다.", true); return false; }
    }

    submitButton.disabled = true;
    submitButton.textContent = currentMode === "register" ? "가입 중…" : "로그인 중…";
    try {
        const endpoint = currentMode === "register" ? "/auth/register" : "/auth/login";
        const response = await fetch(`${API_BASE}${endpoint}`, {
            method  : "POST",
            headers : { "Content-Type" : "application/json" },
            body    : JSON.stringify({ user_id : userId, password : password })
        });
        if (response.ok) {
            // 회원가입 성공 시 곧바로 로그인 상태로 진입한다
            enterChat(userId);
            return false;
        }
        let detailText = "";
        try { detailText = (await response.json()).detail; } catch (_ignored) {}
        showMessage(friendlyError(response.status, detailText), true);
    } catch (networkError) {
        showMessage(`서버에 연결할 수 없습니다 (${API_BASE}). 백엔드가 실행 중인지 확인하세요.`, true);
    } finally {
        submitButton.disabled = false;
        submitButton.textContent = currentMode === "register" ? "회원가입" : "로그인";
    }
    return false;
}

switchMode("login");   // 초기 탭
</script>
</body>
</html>

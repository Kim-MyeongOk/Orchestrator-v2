<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LangGraph 병목 모니터링 대시보드</title>
<!-- 빌드 도구 없이 즉시 동작 : Tailwind CDN -->
<script src="https://cdn.tailwindcss.com"></script>
<style>
    /* 터미널/출력창 스크롤바 */
    .terminal-scroll::-webkit-scrollbar        { width: 6px; }
    .terminal-scroll::-webkit-scrollbar-thumb  { background: #3f3f46; border-radius: 3px; }
    .terminal-scroll::-webkit-scrollbar-track  { background: transparent; }
    @keyframes pulse-dot { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    .streaming-dot { animation: pulse-dot 1s infinite; }
</style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen font-sans">

<div class="max-w-[1400px] mx-auto p-4 lg:p-6">

    <!-- 헤더 -->
    <header class="mb-5 flex items-center justify-between">
        <div>
            <h1 class="text-xl font-bold tracking-tight">LangGraph 병목 모니터링</h1>
            <p class="text-xs text-zinc-500 mt-0.5">체크포인트 복원 시간 · 생각 토큰 누적 크기 · TTFT 실시간 측정</p>
        </div>
        <div id="connection-badge" class="text-xs px-3 py-1 rounded-full bg-zinc-800 text-zinc-400 border border-zinc-700">대기 중</div>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-[300px_1fr] gap-4">

        <!-- ══════════ 좌측 : 설정 패널 ══════════ -->
        <aside class="bg-zinc-900 border border-zinc-800 rounded-xl p-4 space-y-4 h-fit">
            <h2 class="text-sm font-semibold text-zinc-300 border-b border-zinc-800 pb-2">설정</h2>

            <div>
                <label class="block text-xs text-zinc-400 mb-1">백엔드 API URL</label>
                <input id="api-url" type="text" value="http://localhost:8000"
                       class="w-full bg-zinc-950 border border-zinc-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500 transition-colors">
            </div>

            <div>
                <label class="block text-xs text-zinc-400 mb-1">Thread ID</label>
                <div class="flex gap-1.5">
                    <input id="thread-id" type="text" placeholder="예: 0198cccc-...-c003"
                           class="flex-1 min-w-0 bg-zinc-950 border border-zinc-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500 transition-colors">
                    <button onclick="generateThreadId()" title="새 Thread ID 생성"
                            class="shrink-0 px-2.5 bg-zinc-800 hover:bg-zinc-700 border border-zinc-700 rounded-lg text-xs transition-colors">🎲</button>
                </div>
            </div>

            <div>
                <label class="block text-xs text-zinc-400 mb-1">보낼 메시지</label>
                <textarea id="message-input" rows="4" placeholder="예: 2 더하기 3은? 숫자만 답해."
                          class="w-full bg-zinc-950 border border-zinc-700 rounded-lg px-3 py-2 text-sm resize-none focus:outline-none focus:border-indigo-500 transition-colors"></textarea>
            </div>

            <div class="space-y-2 pt-1">
                <button id="diagnose-button" onclick="runDiagnose()"
                        class="w-full py-2.5 bg-zinc-800 hover:bg-zinc-700 border border-zinc-600 rounded-lg text-sm font-medium transition-colors disabled:opacity-40 disabled:cursor-not-allowed">
                    현재 상태 진단
                </button>
                <button id="stream-button" onclick="startStream()"
                        class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 rounded-lg text-sm font-semibold transition-colors disabled:opacity-40 disabled:cursor-not-allowed">
                    스트림 시작
                </button>
            </div>
        </aside>

        <!-- ══════════ 우측 ══════════ -->
        <main class="space-y-4">

            <!-- 우측 상단 : 4개 메트릭 보드 -->
            <section class="grid grid-cols-2 xl:grid-cols-4 gap-3">
                <div class="bg-zinc-900 border border-zinc-800 rounded-xl p-4">
                    <p class="text-xs text-zinc-500">aget_state() 속도</p>
                    <p class="mt-1.5"><span id="metric-load-time" class="text-2xl font-bold text-emerald-400">—</span><span class="text-xs text-zinc-500 ml-1">ms</span></p>
                    <p class="text-[10px] text-zinc-600 mt-1">체크포인트 순수 복원 시간</p>
                </div>
                <div class="bg-zinc-900 border border-zinc-800 rounded-xl p-4">
                    <p class="text-xs text-zinc-500">저장된 메시지 수</p>
                    <p class="mt-1.5"><span id="metric-message-count" class="text-2xl font-bold text-sky-400">—</span><span class="text-xs text-zinc-500 ml-1">개</span></p>
                    <p class="text-[10px] text-zinc-600 mt-1">messages 채널 누적</p>
                </div>
                <div class="bg-zinc-900 border border-zinc-800 rounded-xl p-4">
                    <p class="text-xs text-zinc-500">누적 생각 크기</p>
                    <p class="mt-1.5"><span id="metric-think-kb" class="text-2xl font-bold text-amber-400">—</span><span class="text-xs text-zinc-500 ml-1">KB</span></p>
                    <p class="text-[10px] text-zinc-600 mt-1">&lt;think&gt; + reasoning_content</p>
                </div>
                <div class="bg-zinc-900 border border-zinc-800 rounded-xl p-4">
                    <p class="text-xs text-zinc-500">첫 토큰 (TTFT)</p>
                    <p class="mt-1.5"><span id="metric-ttft" class="text-2xl font-bold text-fuchsia-400">—</span><span class="text-xs text-zinc-500 ml-1">ms</span></p>
                    <p class="text-[10px] text-zinc-600 mt-1">프리필 병목이 드러나는 지표</p>
                </div>
            </section>

            <!-- 우측 하단 : 2분할 뷰 -->
            <section class="grid grid-cols-1 xl:grid-cols-2 gap-3">
                <!-- 모델 응답 실시간 출력창 -->
                <div class="bg-zinc-900 border border-zinc-800 rounded-xl flex flex-col h-[420px]">
                    <div class="px-4 py-2.5 border-b border-zinc-800 flex items-center justify-between">
                        <h3 class="text-xs font-semibold text-zinc-300">모델 응답</h3>
                        <span id="stream-status" class="text-[10px] text-zinc-600">유휴</span>
                    </div>
                    <div id="response-output" class="terminal-scroll flex-1 overflow-y-auto p-4 text-sm leading-relaxed whitespace-pre-wrap text-zinc-200"></div>
                </div>
                <!-- 디버그 로그 터미널 -->
                <div class="bg-black border border-zinc-800 rounded-xl flex flex-col h-[420px]">
                    <div class="px-4 py-2.5 border-b border-zinc-800 flex items-center justify-between">
                        <h3 class="text-xs font-semibold text-zinc-300 font-mono">debug.log</h3>
                        <button onclick="clearLog()" class="text-[10px] text-zinc-600 hover:text-zinc-400 transition-colors">지우기</button>
                    </div>
                    <div id="debug-log" class="terminal-scroll flex-1 overflow-y-auto p-3 font-mono text-[11px] leading-relaxed space-y-0.5"></div>
                </div>
            </section>
        </main>
    </div>
</div>

<script>
/* ══════════════════ 유틸리티 ══════════════════ */

const LOG_COLOR_MAP = { info : "text-zinc-400", success : "text-emerald-400", error : "text-red-400", metric : "text-amber-300", stream : "text-fuchsia-400" };

function appendLog(message, level = "info") {
    const logContainer = document.getElementById("debug-log");
    const timestamp    = new Date().toLocaleTimeString("ko-KR", { hour12 : false }) + "." + String(Date.now() % 1000).padStart(3, "0");
    const line         = document.createElement("div");
    line.className     = LOG_COLOR_MAP[level] || LOG_COLOR_MAP.info;
    line.textContent   = `[${timestamp}] ${message}`;
    logContainer.appendChild(line);
    logContainer.scrollTop = logContainer.scrollHeight;
}

function clearLog() { document.getElementById("debug-log").innerHTML = ""; }

function setBadge(text, isActive) {
    const badge     = document.getElementById("connection-badge");
    badge.textContent = text;
    badge.className   = "text-xs px-3 py-1 rounded-full border " + (isActive
        ? "bg-emerald-950 text-emerald-400 border-emerald-800"
        : "bg-zinc-800 text-zinc-400 border-zinc-700");
}

function setMetric(elementId, value) { document.getElementById(elementId).textContent = value; }

function getSettings() {
    return {
        apiUrl   : document.getElementById("api-url").value.trim().replace(/\/+$/, ""),
        threadId : document.getElementById("thread-id").value.trim(),
        message  : document.getElementById("message-input").value.trim()
    };
}

function generateThreadId() {
    const threadId = crypto.randomUUID();
    document.getElementById("thread-id").value = threadId;
    appendLog(`새 Thread ID 생성 : ${threadId}`);
}

/* ══════════════════ ① 현재 상태 진단 : GET /diagnose ══════════════════ */

async function runDiagnose() {
    const { apiUrl, threadId } = getSettings();
    if (!threadId) { appendLog("Thread ID 를 입력하세요.", "error"); return; }

    const diagnoseButton = document.getElementById("diagnose-button");
    diagnoseButton.disabled = true;
    appendLog(`진단 요청 → GET ${apiUrl}/diagnose?thread_id=${threadId}`);
    const requestStartedAt = performance.now();

    try {
        const response  = await fetch(`${apiUrl}/diagnose?thread_id=${encodeURIComponent(threadId)}`);
        const roundTrip = Math.round(performance.now() - requestStartedAt);
        if (!response.ok) {
            const errorBody = await response.json().catch(() => ({}));
            throw new Error(`HTTP ${response.status} : ${errorBody.detail || "진단 실패"}`);
        }
        const result = await response.json();
        setMetric("metric-load-time",     result.load_time_ms);
        setMetric("metric-message-count", result.message_count);
        setMetric("metric-think-kb",      result.think_tag_kb);
        setBadge("연결됨", true);
        appendLog(`진단 완료 (왕복 ${roundTrip}ms) → aget_state ${result.load_time_ms}ms · 메시지 ${result.message_count}개 · 생각 ${result.think_tag_kb}KB`, "metric");
        if (result.think_tag_kb > 100) appendLog(`경고 : 생각 토큰 누적 ${result.think_tag_kb}KB — 트리밍 미들웨어 적용을 검토하세요.`, "error");
    } catch (error) {
        setBadge("연결 실패", false);
        appendLog(`진단 오류 : ${error.message}`, "error");
    } finally {
        diagnoseButton.disabled = false;
    }
}

/* ══════════════════ ② 스트림 시작 : POST /stream (ReadableStream + TTFT) ══════════════════ */

async function startStream() {
    const { apiUrl, threadId, message } = getSettings();
    if (!threadId) { appendLog("Thread ID 를 입력하세요.", "error"); return; }
    if (!message)  { appendLog("보낼 메시지를 입력하세요.", "error"); return; }

    const streamButton   = document.getElementById("stream-button");
    const responseOutput = document.getElementById("response-output");
    const streamStatus   = document.getElementById("stream-status");
    streamButton.disabled     = true;
    responseOutput.textContent = "";
    streamStatus.innerHTML     = '<span class="streaming-dot text-fuchsia-400">● 스트리밍 중</span>';
    setMetric("metric-ttft", "…");
    appendLog(`스트림 시작 → POST ${apiUrl}/stream (thread: ${threadId.slice(0, 13)}…)`, "stream");

    const requestStartedAt = performance.now();
    let   isFirstTokenSeen = false;
    let   totalCharCount   = 0;

    try {
        const response = await fetch(`${apiUrl}/stream`, {
            method  : "POST",
            headers : { "Content-Type" : "application/json" },
            body    : JSON.stringify({ thread_id : threadId, message : message })
        });
        if (!response.ok || !response.body) throw new Error(`HTTP ${response.status}`);

        const streamReader = response.body.getReader();
        const textDecoder  = new TextDecoder("utf-8");

        while (true) {
            const { done, value } = await streamReader.read();
            if (done) break;
            const chunkText = textDecoder.decode(value, { stream : true });

            // 공백이 아닌 첫 청크 도착 시점 = TTFT (프리필 + 생각 토큰 생성이 모두 여기 반영된다)
            if (!isFirstTokenSeen && chunkText.trim().length > 0) {
                isFirstTokenSeen = true;
                const ttftMs = Math.round(performance.now() - requestStartedAt);
                setMetric("metric-ttft", ttftMs.toLocaleString());
                appendLog(`첫 토큰 도착 (TTFT) : ${ttftMs.toLocaleString()}ms`, "metric");
            }
            totalCharCount             += chunkText.length;
            responseOutput.textContent += chunkText;
            responseOutput.scrollTop    = responseOutput.scrollHeight;
        }

        const totalMs = Math.round(performance.now() - requestStartedAt);
        appendLog(`스트림 완료 : 총 ${totalMs.toLocaleString()}ms · ${totalCharCount.toLocaleString()}자 수신`, "success");
        setBadge("연결됨", true);

        // 턴 종료 후 자동 재진단 : 메시지 수/생각 크기 누적 추이를 바로 확인한다
        appendLog("턴 종료 → 자동 재진단 실행");
        await runDiagnose();
    } catch (error) {
        setBadge("연결 실패", false);
        appendLog(`스트림 오류 : ${error.message}`, "error");
    } finally {
        streamButton.disabled  = false;
        streamStatus.textContent = "유휴";
    }
}

/* ══════════════════ 초기화 ══════════════════ */
appendLog("대시보드 준비 완료. 백엔드 : python src/server.py (포트 8000)");
</script>
</body>
</html>

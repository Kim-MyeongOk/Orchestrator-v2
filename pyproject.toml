[project]
name = "vLLM_Orchestrator_Deep_Agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "deepagents>=0.6.12",
    "fastapi>=0.139.0",
    "httpx>=0.28.1",
    "langchain-anthropic>=1.4.8",
    "langchain-google-genai>=4.2.7",
    "langchain-core>=1.4.9",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.3.5",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.9",
    "langgraph-checkpoint-postgres>=3.1.0,<4",
    "psycopg[binary]>=3.3.4",
    "psycopg-pool>=3.3.1",
    "pydantic>=2.13.4",
    "omegaconf>=2.3.0",
    "pyyaml>=6.0.0",
    "python-dotenv>=1.2.2",
    "redis>=8.0.1",
    "uvicorn>=0.51.0",
    "boto3>=1.43.56",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = [
    "moto[s3,server]>=5.2.2",
    "pillow>=12.3.0",
    "pytest>=9.1.1",
]

[tool.uv]
cache-dir = "C:\\.uv-cache"

[tool.pytest.ini_options]
testpaths  = ["tests"]
pythonpath = ["backend"]

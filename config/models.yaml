##################################################
# 모델 카탈로그
# .env 의 MODEL_* 설정을 대체한다. 각 항목은 ModelConfiguration 필드와 1:1 매핑되고,
# 값 안의 ${oc.env:VAR,default} 는 OmegaConf 가 로드 시 환경변수로 치환한다 (API 키 같은 시크릿은 .env 에 남긴다).
# 미설정 시 기본값을 함께 적는다 — 예: ${oc.env:GOOGLE_API_KEY,null} 은 변수가 없으면 None 이 된다.
#
# provider 종류
#   - google : Google Gemini API — gemini / gemma 계열 (api_key = ${oc.env:GOOGLE_API_KEY,null})
#   - ollama : 로컬 Ollama (base_url = http://localhost:11434)
#   - openai | anthropic | lm_studio | vllm 도 사용 가능 (vllm 은 base_url + default_header_dictionary 지정)
##################################################

default_model : gpt_oss_120b

model_info :

    # ══════════ 로컬 Ollama ══════════

    qwen3_vl_local :
        provider                  : ollama
        name                      : qwen3-vl:4b
        api_key                   : ${oc.env:OLLAMA_API_KEY,null}
        base_url                  : http://localhost:11434
        enable                    : true
        temperature               : 0.0
        maximum_token_count       : 4096
        context_token_count       : 8192
        timeout_second_count      : 120.0
        maximum_retry_count       : 2
        default_header_dictionary :
            Authorization : "Bearer ${oc.env:OLLAMA_API_KEY,null}"
        extra_body                :
        reasoning_enabled         : true

    llama3_2_vision :
        provider                  : ollama
        name                      : llama3.2-vision
        api_key                   : ${oc.env:OLLAMA_API_KEY,null}
        base_url                  : http://localhost:11434
        enable                    : true
        temperature               : 0.0
        maximum_token_count       : 4096
        context_token_count       : 16384
        timeout_second_count      : 120.0
        maximum_retry_count       : 2
        default_header_dictionary :
            Authorization : "Bearer ${oc.env:OLLAMA_API_KEY,null}"
        reasoning_enabled         : false

    gpt_oss_120b :
        provider                  : ollama
        name                      : gpt-oss:120b-cloud
        api_key                   : ${oc.env:OLLAMA_API_KEY,null}
        base_url                  : http://localhost:11434
        enable                    : true
        temperature               : 0.0
        maximum_token_count       : 4096
        context_token_count       : 8192
        timeout_second_count      : 300.0
        maximum_retry_count       : 2
        default_header_dictionary :
            Authorization : "Bearer ${oc.env:OLLAMA_API_KEY,null}"
        reasoning_enabled         : false
